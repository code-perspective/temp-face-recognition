cryptoface:
  ckpt_path:      "submission/face/checkpoints/backbone-64x64.ckpt"
  orion_config:   "submission/face/orion_configs/cryptoface_net4.yml"
  input_size:     64
  # L2NormPoly coefficients: a*y^2 + b*y + c ≈ 1/sqrt(y), y = sum(x^2)
  # Fitted on CelebA face_dataset.npy (SOS range [108, 505], mean=267, std=76)
  l2_poly_coeffs: [3.497142e-07, -3.070292e-04, 1.182291e-01]
  # Number of pairs to process in parallel on the server. Lower this on machines
  # with less RAM (each worker peaks at ~100GB on top of the 237GB compiled pipeline).
  n_workers:      4
